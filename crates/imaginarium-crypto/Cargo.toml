[package]
name = "imaginarium-crypto"
description = "Suite 1 cryptography for .imag documents: record encryption, keyrings, signatures and the ACL chain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# Deterministic randomness for reproducible test vectors. Never in production.
test-vectors = []

[dependencies]
argon2.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
getrandom = { workspace = true, features = ["sys_rng"] }
hpke.workspace = true
imaginarium-format.workspace = true
ml-dsa.workspace = true
prost.workspace = true
rand_core.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true

[dev-dependencies]
criterion.workspace = true
# The vectors test needs deterministic randomness.
imaginarium-crypto = { path = ".", features = ["test-vectors"] }
proptest.workspace = true

[lints]
workspace = true
