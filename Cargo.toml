# Imaginarium Cargo workspace.
#
# Layering rules (which crate may depend on which) are described in
# docs/PLAN.md §4.1 and enforced by `cargo xtask check-layers`.

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Scratch crates under target/ (experiments, benchmarks of alternatives) are
# never members; `cargo new` there would otherwise add itself here.
exclude = ["target"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
authors = ["Giosuel <me@giosuel.ch>"]
repository = "https://github.com/giosuel/imaginarium"
# `homepage` is added once the website is deployed (M0.7).
publish = false

[workspace.dependencies]
# Internal crates. Members depend on each other via `name.workspace = true`.
imaginarium-canvas = { path = "crates/imaginarium-canvas" }
imaginarium-cli = { path = "crates/imaginarium-cli" }
imaginarium-commands = { path = "crates/imaginarium-commands" }
imaginarium-crypto = { path = "crates/imaginarium-crypto" }
imaginarium-format = { path = "crates/imaginarium-format" }
imaginarium-io-native = { path = "crates/imaginarium-io-native" }
imaginarium-model = { path = "crates/imaginarium-model" }
imaginarium-profiling = { path = "crates/imaginarium-profiling" }
imaginarium-reactive = { path = "crates/imaginarium-reactive" }
imaginarium-render = { path = "crates/imaginarium-render" }
imaginarium-settings = { path = "crates/imaginarium-settings" }
imaginarium-shell = { path = "crates/imaginarium-shell" }
imaginarium-test-utils = { path = "crates/imaginarium-test-utils" }
imaginarium-text = { path = "crates/imaginarium-text" }
imaginarium-ui = { path = "crates/imaginarium-ui" }

# External crates are added here (with exact minor versions) when a
# milestone first needs them, never speculatively.
accesskit = "0.25.1"
accesskit_consumer = "0.39.1"
accesskit_winit = "0.34.1"
anyhow = "1.0.104"
# Wayland clipboard through the data-control protocol (Hyprland, Sway, KDE);
# X11 otherwise.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
crc32c = "0.6.8"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
ed25519-dalek = { version = "3.0.0", features = ["alloc"] }
# fontconfig is loaded at run time: builds need no fontconfig headers, and the
# binary starts (without system fonts) where fontconfig is missing.
fontique = { version = "0.12.0", features = ["fontconfig-dlopen"] }
getrandom = "0.4.3"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "chacha", "hkdfsha2", "mlkem", "x25519"] }
imbl = "7.0.2"
loro = "1.16.2"
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "rand_core"] }
parley = "0.12.0"
peak_alloc = "0.3.0"
pollster = "1.0.1"
proptest = "1.11.0"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.9.1"
rand_core = "0.10.1"
serde = "1.0.229"
serde_json = "1.0.151"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
toml = { version = "1.1.6", default-features = false }
taffy = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
tracing-tracy = { version = "0.12.0", default-features = false }
unicode-normalization = "0.1.25"
vello_common = "0.3.0"
vello_cpu = "0.3.0"
vello_gpu = "0.3.0"
wgpu = "30.0.1"
# Without `wayland-csd-adwaita`: its title text pulls in `ttf-parser`, which
# is unmaintained (RUSTSEC-2026-0192). The fallback decorations on
# compositors without server-side ones (GNOME) have no title text; the app
# draws its own title bar later anyway.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
zeroize = { version = "1.9.0", features = ["derive"] }
zstd = { version = "0.14.0", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
# `deny` rather than `forbid`, so a crate can opt out locally. Every opt-out
# needs an ADR. Crates that must never contain unsafe code add
# `#![forbid(unsafe_code)]` themselves.
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# `unwrap`/`expect` are allowed in tests via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# Release optimizations with full debug info, for tracy/perf/samply sessions:
# `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# Optimize dependencies even in dev builds. Rendering, image decoding and
# compression are unusably slow at opt-level 0, while our own crates stay
# fast to compile and easy to debug.
#
# Dependencies get only line tables, not full debug info. Backtraces still
# show file:line, but you can't inspect dependency locals in a debugger
# (rarely needed). Measured on a clean debug build of the planned heavy
# stack (vello/wgpu, winit, parley, loro, …): -11 % CPU time, -35 % peak
# rustc memory, -44 % target/ size.
#
# This override also applies to crates that only run at compile time (proc
# macros, build scripts), because it takes precedence over `build-override`.
# The generated block at the end of this file resets those to opt-level 0
# (ADR-0017). It's kept in sync by `cargo xtask dev-profile --write` and
# checked by `cargo xtask check`.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# BEGIN GENERATED: build-time-only crates (`cargo xtask dev-profile --write`)
