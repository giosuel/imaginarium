# Imaginarium Cargo workspace.
#
# Layering rules (which crate may depend on which) are described in
# docs/PLAN.md §4.1 and enforced by `cargo xtask check-layers`.

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
authors = ["Giosuel <me@giosuel.ch>"]
repository = "https://github.com/giosuel/imaginarium"
# `homepage` is added once the website is deployed (M0.7).
publish = false

[workspace.dependencies]
# Internal crates. Members depend on each other via `name.workspace = true`.
imaginarium-commands = { path = "crates/imaginarium-commands" }
imaginarium-format = { path = "crates/imaginarium-format" }
imaginarium-profiling = { path = "crates/imaginarium-profiling" }
imaginarium-settings = { path = "crates/imaginarium-settings" }
imaginarium-test-utils = { path = "crates/imaginarium-test-utils" }

# External crates are added here (with exact minor versions) when a
# milestone first needs them, never speculatively.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
crc32c = "0.6.8"
getrandom = "0.4.3"
prost = "0.14.4"
prost-build = "0.14.4"
proptest = "1.11.0"
protox = "0.9.1"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
tracing-tracy = { version = "0.12.0", default-features = false }
zstd = { version = "0.14.0", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
# `deny` rather than `forbid`, so a crate can opt out locally. Every opt-out
# needs an ADR. Crates that must never contain unsafe code add
# `#![forbid(unsafe_code)]` themselves.
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# `unwrap`/`expect` are allowed in tests via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# Release optimizations with full debug info, for tracy/perf/samply sessions:
# `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# Optimize dependencies even in dev builds. Rendering, image decoding and
# compression are unusably slow at opt-level 0, while our own crates stay
# fast to compile and easy to debug.
#
# Dependencies get only line tables, not full debug info. Backtraces still
# show file:line, but you can't inspect dependency locals in a debugger
# (rarely needed). Measured on a clean debug build of the planned heavy
# stack (vello/wgpu, winit, parley, loro, …): -11 % CPU time, -35 % peak
# rustc memory, -44 % target/ size.
#
# This override also applies to crates that only run at compile time (proc
# macros, build scripts), because it takes precedence over `build-override`.
# The generated block at the end of this file resets those to opt-level 0
# (ADR-0017). It's kept in sync by `cargo xtask dev-profile --write` and
# checked by `cargo xtask check`.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# BEGIN GENERATED: build-time-only crates (`cargo xtask dev-profile --write`)
# Crates that only run at compile time (proc macros, build scripts and
# their dependencies) are built unoptimized: optimizing them cost ~1/3 of a
# clean dev build for no runtime benefit (ADR-0017). Don't edit by hand.
[profile.dev.package.anyhow]
opt-level = 0
